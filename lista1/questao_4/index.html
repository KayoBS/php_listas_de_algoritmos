<html>

<head>
  <title>Calculadora de porcentagem</title>
</head>

<body>
  <form name="f_calc" method="post" action="main.php">
    <label>Escreva um número</label><br />
    <input type="number" name="numero" size="40" step="0.01" maxlength="3"><br /><br />

    <label>Escreva uma porcentagem qualquer</label><br />
    <input type="number" name="porcentagem" step="0.01" size="40" maxlength="2"><br /><br />

    <input type="submit" value="Enviar"><br />
    <input type="reset" value="Limpar"><br />
  </form>
</body>

</html>

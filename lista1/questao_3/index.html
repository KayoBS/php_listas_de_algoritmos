<html>

<head>
  <title>Lojas Sua Melhor Compra</title>
</head>

<body>
  <form name="f_compra" method="post" action="main.php">
    <label>Valor da compra</label><br />
    <input type="number" name="valor_compra" step="0.01" min="0" size="40" maxlength="3"><br /><br />

    <input type="reset" value="Limpar"><br />
  </form>
</body>

</html>
